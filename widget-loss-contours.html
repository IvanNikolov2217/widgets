<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loss Contours</title>
<style>
  :root {
    --bg: #eef4fb;
    --fg: #1a2230;
    --muted: #5f6b7d;
    --border: #c2d3e8;
    --grid: #c2d3e8;
    --axis: #8fa6c2;
    --ellipse: #2563eb;
    --optimum: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b2433;
      --fg: #e6ecf5;
      --muted: #9aa7bb;
      --border: #364964;
      --grid: #2c3a52;
      --axis: #54678a;
      --ellipse: #60a5fa;
      --optimum: #60a5fa;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 1.25rem;
    font-size: 14px;
    border-radius: 10px;
  }
  .caption {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .85rem;
  }
  .stage { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
  .plot-wrap { flex: 1 1 320px; min-width: 280px; }
  svg { width: 100%; height: auto; display: block; }
  .legend {
    display: flex; gap: 1.1rem; flex-wrap: wrap;
    margin-top: .8rem; font-size: 12px; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .swatch.dot { width: 9px; height: 9px; border-radius: 50%; }
  .note {
    margin-top: .85rem;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="caption">Loss contours — training error as a landscape</div>

<div class="stage">
  <div class="plot-wrap">
    <svg id="plot" viewBox="0 0 360 360" aria-label="Concentric loss contours centred on the unregularized optimum, like elevation lines on a map.">
      <g id="grid"></g>
      <g id="axes"></g>
      <g id="ellipses"></g>
      <circle id="optimum" r="6" stroke="#fff" stroke-width="1.5"></circle>
      <text id="lbl-w1" font-size="12" font-style="italic">w₁</text>
      <text id="lbl-w2" font-size="12" font-style="italic">w₂</text>
      <text id="lbl-opt" font-size="11">w&#770;</text>
    </svg>
  </div>
</div>

<div class="legend">
  <span><i class="swatch" style="background:var(--ellipse)"></i> equal-loss contours</span>
  <span><i class="swatch dot" style="background:var(--optimum)"></i> unregularized optimum</span>
</div>

<p class="note">
  Each ellipse joins all weight pairs that give the same training error — like elevation lines on a map.
  The centre is the unregularized optimum (lowest error); each ring outward marks a higher error level.
</p>

<script>
const SVG = 360, C = 180, SCALE = 42;
const svg = document.getElementById('plot');
function W2P(wx, wy) { return [C + wx * SCALE, C - wy * SCALE]; }
function cssvar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

// Unregularized optimum, fixed.
const opt = { x: 1.4, y: 0.9 };
// Tilted ellipse loss (a little anisotropy reads as a "landscape").
const Lxx = 1.0, Lyy = 1.7, Lxy = 0.45;

function drawGrid() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  const ax = document.getElementById('axes'); ax.innerHTML = '';
  const grid = cssvar('--grid'), axis = cssvar('--axis');
  for (let i = -4; i <= 4; i++) {
    const [x] = W2P(i, 0);
    g.insertAdjacentHTML('beforeend',
      `<line x1="${x}" y1="0" x2="${x}" y2="${SVG}" stroke="${grid}" stroke-width="1"/>`);
    const [, y] = W2P(0, i);
    g.insertAdjacentHTML('beforeend',
      `<line x1="0" y1="${y}" x2="${SVG}" y2="${y}" stroke="${grid}" stroke-width="1"/>`);
  }
  ax.insertAdjacentHTML('beforeend',
    `<line x1="0" y1="${C}" x2="${SVG}" y2="${C}" stroke="${axis}" stroke-width="1.5"/>`);
  ax.insertAdjacentHTML('beforeend',
    `<line x1="${C}" y1="0" x2="${C}" y2="${SVG}" stroke="${axis}" stroke-width="1.5"/>`);
}

function ellipsePath(levelL) {
  const pts = [];
  for (let i = 0; i <= 96; i++) {
    const t = (i / 96) * Math.PI * 2;
    const ux = Math.cos(t), uy = Math.sin(t);
    const a = Lxx*ux*ux + Lyy*uy*uy + 2*Lxy*ux*uy;
    const r = Math.sqrt(levelL / a);
    const [px, py] = W2P(opt.x + r*ux, opt.y + r*uy);
    pts.push(`${px.toFixed(1)},${py.toFixed(1)}`);
  }
  return 'M' + pts.join(' L') + ' Z';
}

function render() {
  const ell = document.getElementById('ellipses');
  ell.innerHTML = '';
  const col = cssvar('--ellipse');
  const radii = [0.5, 1.0, 1.6, 2.3, 3.1];   // weight-unit "sizes"
  radii.forEach((rad, i) => {
    const levelL = rad * rad;
    const op = 0.7 - i * 0.1;
    ell.insertAdjacentHTML('beforeend',
      `<path d="${ellipsePath(levelL)}" fill="none" stroke="${col}" ` +
      `stroke-width="${i === 0 ? 2 : 1.2}" opacity="${op.toFixed(2)}"/>`);
  });

  const [ox, oy] = W2P(opt.x, opt.y);
  const o = document.getElementById('optimum');
  o.setAttribute('cx', ox); o.setAttribute('cy', oy);
  o.setAttribute('fill', cssvar('--optimum'));
  const lo = document.getElementById('lbl-opt');
  lo.setAttribute('x', ox + 9); lo.setAttribute('y', oy - 8);
  lo.setAttribute('fill', cssvar('--fg'));
}

function placeLabels() {
  document.getElementById('lbl-w1').setAttribute('x', SVG - 18);
  document.getElementById('lbl-w1').setAttribute('y', C - 6);
  document.getElementById('lbl-w2').setAttribute('x', C + 6);
  document.getElementById('lbl-w2').setAttribute('y', 14);
  document.getElementById('lbl-w1').setAttribute('fill', cssvar('--muted'));
  document.getElementById('lbl-w2').setAttribute('fill', cssvar('--muted'));
}

if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    drawGrid(); placeLabels(); render();
  });
}

drawGrid();
placeLabels();
render();
</script>
</body>
</html>
