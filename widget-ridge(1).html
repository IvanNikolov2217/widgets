<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridge Regression — Interactive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #eef4fb;
    --fg: #1a2230;
    --muted: #5f6b7d;
    --tab-bg: #dbe7f5;
    --tab-fg: #3a4759;
    --tab-hover: #c9daee;
    --border: #c2d3e8;
    --grid: rgba(40,60,90,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b2433;
      --fg: #e6ecf5;
      --muted: #9aa7bb;
      --tab-bg: #27344a;
      --tab-fg: #c2ccdc;
      --tab-hover: #324158;
      --border: #364964;
      --grid: rgba(180,200,230,.12);
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 1.25rem;
    font-size: 14px;
    border-radius: 10px;
  }
  .caption {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .85rem;
  }
  .tab-row { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab-btn {
    padding: 5px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--tab-bg);
    font-size: 13px;
    cursor: pointer;
    color: var(--tab-fg);
    font-family: inherit;
    font-weight: 500;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .tab-btn:hover:not(.active) { background: var(--tab-hover); }
  .chart-wrap { position: relative; height: 260px; }
  .note {
    margin-top: .75rem;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="caption">Ridge regression — predicted salary vs age</div>

<div class="tab-row">
  <button class="tab-btn active" id="r0" onclick="setRidge(0)">λ = 0 (no regularization)</button>
  <button class="tab-btn" id="r1" onclick="setRidge(1)">λ = 0.02</button>
  <button class="tab-btn" id="r2" onclick="setRidge(2)">λ = 0.10</button>
</div>

<div class="chart-wrap">
  <canvas id="ridgeChart" role="img" aria-label="Line chart showing Ridge regression salary predictions for different lambda values against training data points.">Ridge regression predictions chart.</canvas>
</div>

<p class="note">
  Observe how increasing λ smooths the prediction curve. At λ = 0.02 the wild oscillations of the unregularized model almost completely disappear, producing a smooth, generalizable prediction.
</p>

<script>
const ages = [];
for (let a = 18; a <= 72; a += 0.5) ages.push(a);

const trainX = [25,55,27,35,60,65,45,40,50,30];
const trainY = [85,280,90,130,250,240,220,180,270,110];

const means = [43.2, 2045, 104231, 5610457, 314153953];
const stds  = [14.1, 1259, 89653, 5975341, 389179640];

function scale(x) {
  const f = [x, x*x, x*x*x, x*x*x*x, x*x*x*x*x];
  return f.map((v, i) => (v - means[i]) / stds[i]);
}

function predict(coeffs, x) {
  const [a, w1, w2, w3, w4, w5] = coeffs;
  const s = scale(x);
  return a + w1*s[0] + w2*s[1] + w3*s[2] + w4*s[3] + w5*s[4];
}

// [a, w1, w2, w3, w4, w5] — for the standardized features used by scale()
const ridgeCoeffs = [
  // λ=0: true least-squares fit — interpolates the 10 points almost exactly (overfitting)
  [199.03, 9252.74, -42088.71, 74067.43, -58555.66, 17380.77], // λ=0
  [216.5, 97.8, 36.6, -8.5, -35.0, -44.6],                     // λ=0.02
  [216.5, 56.5, 28.1, 3.7, -15.1, -28.4],                      // λ=0.10
];

const trainPts = trainX.map((x, i) => ({ x, y: trainY[i] }));

// Read theme colors from CSS variables so the chart matches light/dark mode.
function themeColors() {
  const cs = getComputedStyle(document.documentElement);
  return {
    grid: cs.getPropertyValue('--grid').trim(),
    muted: cs.getPropertyValue('--muted').trim(),
    fg: cs.getPropertyValue('--fg').trim(),
  };
}

const LINE = '#2563eb';   // prediction line — blue
const PTS  = '#e11d48';   // training points — rose-red

function curve(i) {
  return ages.map(a => ({
    x: a,
    y: Math.max(0, Math.min(340, predict(ridgeCoeffs[i], a)))
  }));
}

const ctx = document.getElementById('ridgeChart').getContext('2d');
const tc = themeColors();
const chart = new Chart(ctx, {
  type: 'line',
  data: {
    datasets: [
      {
        label: 'Prediction',
        data: curve(0),
        borderColor: LINE,
        borderWidth: 2.5,
        pointRadius: 0,
        tension: 0.3,
      },
      {
        label: 'Training data',
        data: trainPts,
        type: 'scatter',
        backgroundColor: PTS,
        pointRadius: 6,
        pointHoverRadius: 8,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {
        display: true,
        labels: { color: tc.fg, font: { size: 12 }, boxWidth: 14, padding: 12 }
      }
    },
    scales: {
      x: {
        type: 'linear', min: 18, max: 72,
        title: { display: true, text: 'Age (years)', color: tc.fg, font: { size: 12 } },
        grid: { color: tc.grid },
        ticks: { color: tc.muted, font: { size: 11 } }
      },
      y: {
        min: 0, max: 340,
        title: { display: true, text: 'Salary ($k)', color: tc.fg, font: { size: 12 } },
        grid: { color: tc.grid },
        ticks: { color: tc.muted, font: { size: 11 } }
      }
    }
  }
});

// Re-apply theme colors to the chart when the system scheme changes.
function applyChartTheme() {
  const c = themeColors();
  const s = chart.options.scales;
  chart.options.plugins.legend.labels.color = c.fg;
  s.x.title.color = c.fg; s.x.grid.color = c.grid; s.x.ticks.color = c.muted;
  s.y.title.color = c.fg; s.y.grid.color = c.grid; s.y.ticks.color = c.muted;
  chart.update();
}
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change', applyChartTheme);
}

const btns = ['r0', 'r1', 'r2'];
function setRidge(i) {
  btns.forEach((id, j) => document.getElementById(id).classList.toggle('active', i === j));
  chart.data.datasets[0].data = curve(i);
  chart.update();
}
</script>
</body>
</html>
