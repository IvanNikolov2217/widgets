<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2 Constraint Region — Circle</title>
<style>
  :root {
    --bg: #eef4fb;
    --fg: #1a2230;
    --muted: #5f6b7d;
    --border: #c2d3e8;
    --grid: #c2d3e8;
    --axis: #8fa6c2;
    --region: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b2433;
      --fg: #e6ecf5;
      --muted: #9aa7bb;
      --border: #364964;
      --grid: #2c3a52;
      --axis: #54678a;
      --region: #60a5fa;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 1.25rem;
    font-size: 14px;
    border-radius: 10px;
  }
  .caption {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .85rem;
  }
  .stage { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
  .plot-wrap { width: 100%; max-width: 360px; margin: 0 auto; }
  svg { width: 100%; height: auto; display: block; }
  .legend {
    display: flex; gap: 1.1rem; flex-wrap: wrap;
    margin-top: .8rem; font-size: 12px; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .swatch { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
  .note {
    margin-top: .85rem;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="caption">L2 constraint region — the circle</div>

<div class="stage">
  <div class="plot-wrap">
    <svg id="plot" viewBox="0 0 360 360" aria-label="The L2 constraint region: a smooth circle centred on the origin.">
      <g id="grid"></g>
      <g id="axes"></g>
      <path id="region"></path>
      <text id="lbl-w1" font-size="12" font-style="italic">w₁</text>
      <text id="lbl-w2" font-size="12" font-style="italic">w₂</text>
      <text id="lbl-c" font-size="11">c</text>
    </svg>
  </div>
</div>

<div class="legend">
  <span><i class="swatch" style="background:var(--region);opacity:.5"></i> allowed region (w₁² + w₂² ≤ c)</span>
</div>
<script>
const SVG = 360, C = 180, SCALE = 56;   // larger scale: region fills the frame
const svg = document.getElementById('plot');
function W2P(wx, wy) { return [C + wx * SCALE, C - wy * SCALE]; }
function cssvar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

const c = 2.0;   // constraint radius (weight units)

function drawGrid() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  const ax = document.getElementById('axes'); ax.innerHTML = '';
  const grid = cssvar('--grid'), axis = cssvar('--axis');
  for (let i = -3; i <= 3; i++) {
    const [x] = W2P(i, 0);
    g.insertAdjacentHTML('beforeend',
      `<line x1="${x}" y1="0" x2="${x}" y2="${SVG}" stroke="${grid}" stroke-width="1"/>`);
    const [, y] = W2P(0, i);
    g.insertAdjacentHTML('beforeend',
      `<line x1="0" y1="${y}" x2="${SVG}" y2="${y}" stroke="${grid}" stroke-width="1"/>`);
  }
  ax.insertAdjacentHTML('beforeend',
    `<line x1="0" y1="${C}" x2="${SVG}" y2="${C}" stroke="${axis}" stroke-width="1.5"/>`);
  ax.insertAdjacentHTML('beforeend',
    `<line x1="${C}" y1="0" x2="${C}" y2="${SVG}" stroke="${axis}" stroke-width="1.5"/>`);
}

function render() {
  const reg = document.getElementById('region');
  const [cx, cy] = W2P(0, 0);
  const r = c * SCALE;
  reg.setAttribute('d',
    `M${cx-r},${cy} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 Z`);
  reg.setAttribute('fill', cssvar('--region'));
  reg.setAttribute('fill-opacity', '0.12');
  reg.setAttribute('stroke', cssvar('--region'));
  reg.setAttribute('stroke-width', '2.5');

  // 'c' label on the boundary along +w1
  const [lx, ly] = W2P(c, 0);
  const lc = document.getElementById('lbl-c');
  lc.setAttribute('x', lx - 14); lc.setAttribute('y', ly - 8);
  lc.setAttribute('fill', cssvar('--region'));
}

function placeLabels() {
  document.getElementById('lbl-w1').setAttribute('x', SVG - 18);
  document.getElementById('lbl-w1').setAttribute('y', C - 6);
  document.getElementById('lbl-w2').setAttribute('x', C + 6);
  document.getElementById('lbl-w2').setAttribute('y', 14);
  document.getElementById('lbl-w1').setAttribute('fill', cssvar('--muted'));
  document.getElementById('lbl-w2').setAttribute('fill', cssvar('--muted'));
}

if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    drawGrid(); placeLabels(); render();
  });
}

drawGrid();
placeLabels();
render();
</script>
</body>
</html>
